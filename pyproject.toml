[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azbest-drone-mapping"
version = "0.1.0"
description = "Offline geospatial planning for evidence-aware roof surveys"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0,<3", "pyproj>=3.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
drone-survey = "drone_mapping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
